artifact: verification-policy
policy-id: sparse-layout-bridge-v1
rules:
- scope:
    subsystems:
    - core
    change-categories:
    - code-only
    - mixed
    risk-classes:
    - medium
    - high
  required-evidence:
    unit-tests: required
    lint: required
    format: required
    property-tests: optional
    runtime-assertions: optional
    docs-or-nl-spec: recommended
  evidence-roles:
    regression:
    - unit
    - lint
    - format
  omission-rules:
    allowed?: true
    requires-record?: true
    required-fields:
    - rationale
    - owner
  notes:
  - Requires unit, lint, and formatting evidence for code and mixed changes.
