artifact: verification-policy
policy_id: sparse-layout-bridge-v1
rules:
- scope:
    subsystems:
    - core
    change_categories:
    - code-only
    - mixed
    risk_classes:
    - medium
    - high
  required_evidence:
    unit_tests: required
    lint: required
    format: required
    benchmarks: required
    property_tests: optional
    runtime_assertions: optional
    docs_or_nl_spec: recommended
  evidence_roles:
    regression:
    - unit
    - lint
    - format
    - benchmark
  notes:
  - Requires unit, lint, formatting, and benchmark smoke evidence for code and mixed changes.
