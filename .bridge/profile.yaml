subsystems:
- name: core
  code_globs:
  - src/**/*
  docs_globs:
  - docs/**/*
  test_globs:
  - test/**/*
  expected_evidence:
  - unit
  - lint
  - format
  - benchmark
  system_category: api
  risk_class: medium
project_name: sparse-layout
artifact_paths:
  root: .bridge/ephemeral
  evidence: .bridge/ephemeral/evidence
test_paths:
- test
docs_paths:
- docs
kind: project-profile
verification_policy_path: .bridge/verification-policy.yaml
code_paths:
- src
root_path: ..
canonical_commands:
- id: unit
  kind: unit
  role: regression
  command: |
    clojure -M:test 1>&2
    status=$?
    if [ "$status" -eq 0 ]; then
      printf '\n{:evidence-status "passed"}\n'
    else
      printf '\n{:evidence-status "failed" :failure-signals ["clojure -M:test exited nonzero"]}\n'
    fi
    exit "$status"
  description: Run unit tests
- id: lint
  kind: lint
  role: regression
  command: |
    clojure -M:lint 1>&2
    status=$?
    if [ "$status" -eq 0 ]; then
      printf '\n{:evidence-status "passed"}\n'
    else
      printf '\n{:evidence-status "failed" :failure-signals ["clojure -M:lint exited nonzero"]}\n'
    fi
    exit "$status"
  description: Run clj-kondo via codestyle.lint
- id: format
  kind: format
  role: regression
  command: |
    clojure -M:format check 1>&2
    status=$?
    if [ "$status" -eq 0 ]; then
      printf '\n{:evidence-status "passed"}\n'
    else
      printf '\n{:evidence-status "failed" :failure-signals ["clojure -M:format check exited nonzero"]}\n'
    fi
    exit "$status"
  description: Check advanced formatting via codestyle.advanced-format
- id: benchmark-smoke
  kind: benchmark
  role: regression
  command: |
    clojure -M:bench smoke 1>&2
    status=$?
    if [ "$status" -eq 0 ]; then
      printf '\n{:evidence-status "passed"}\n'
    else
      printf '\n{:evidence-status "failed" :failure-signals ["clojure -M:bench smoke exited nonzero"]}\n'
    fi
    exit "$status"
  description: Run benchmark smoke checks
